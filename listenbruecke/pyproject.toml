[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "listenbruecke"
version = "0.1.0"
description = "Einkaufslisten von Bring!, Monsieur Cuisine und Home Assistant zusammenführen"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
dependencies = [
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "aiohttp==3.14.5",
  "bring-api==1.1.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "PyYAML==6.0.3"]

[project.scripts]
listenbruecke = "listenbruecke.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/listenbruecke"]

[tool.hatch.build.targets.wheel.force-include]
"web" = "listenbruecke/web"
"browser-helper" = "listenbruecke/browser-helper"
"THIRD_PARTY_LICENSES.md" = "listenbruecke/THIRD_PARTY_LICENSES.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
